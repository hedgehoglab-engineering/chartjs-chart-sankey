name: Main CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shared-ci:
    uses: kurkle/configs/.github/workflows/shared-ci.yml@v1
    with:
      fetch-depth: 0
      install-command: npm clean-install --ignore-scripts && npx playwright install chromium firefox
      # Vitest browser mode replaced Karma, so the per-browser lcov split is gone.
      coverage-paths: |
        coverage/browser/lcov.info
        coverage/unit/lcov.info
      # Playwright's browsers are headless; the shared xvfb wrapper is not needed.
      browser-tests: false
      run-audit-signatures: true
      # We don't have a SonarCloud project (or token) for this fork.
      run-sonar: false

  release:
    runs-on: ubuntu-latest
    needs: [shared-ci]
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm clean-install --ignore-scripts

      - name: Build
        run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install semantic-release
